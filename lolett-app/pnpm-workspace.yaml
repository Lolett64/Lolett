# Scripts d'installation autorisés.
#
# pnpm 11 refuse d'exécuter un script post-installation sans autorisation
# explicite, et fait désormais échouer `pnpm install` (ERR_PNPM_IGNORED_BUILDS)
# au lieu d'avertir. Le réglage ne se met plus dans package.json : ce fichier
# est son seul emplacement valide.
#
# sharp est le plus important : sans son script, le redimensionnement d'images
# casse en production sans la moindre erreur de compilation.
onlyBuiltDependencies:
  - '@sentry/cli'
  - sharp
  - unrs-resolver
